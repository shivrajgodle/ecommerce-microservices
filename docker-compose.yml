# Modern Kafka (3.x+) can run in KRaft mode — no separate Zookeeper
# process needed anymore. Kafka manages its own metadata/consensus
# internally now, which is one less moving part for local learning
# (and increasingly how Kafka runs in production too).
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Convenience for local dev only — auto-creates a topic the first
      # time anyone produces/consumes to a name that doesn't exist yet.
      # Real deployments disable this and create topics explicitly
      # (with deliberate partition counts and replication factors) —
      # flagging that now so the convenience here doesn't read as the
      # production-correct approach.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"