server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      # DISABLED deliberately — explained in full below, this is the
      # single most important config line in this file.
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.learning.*"
        spring.json.use.type.headers: false
        # Since type headers are off, JsonDeserializer needs to be told
        # explicitly what LOCAL class to deserialize order.created
        # messages into — this is Payment Service's OWN copy of the
        # event class (Step 5 below), matching the wire shape Order
        # Service produces, per the Anti-Corruption Layer pattern.
        spring.json.value.default.type: com.learning.paymentservice.event.OrderCreatedEvent
    listener:
      # RECORD ack-mode + manual auto-commit disabled together means:
      # Spring commits this record's offset automatically ONLY after
      # the listener method returns successfully — not on a timer, not
      # regardless of outcome. If the listener throws, the offset is
      # NOT committed, and (per the error handler in Step 6) the
      # message gets retried.
      ack-mode: record