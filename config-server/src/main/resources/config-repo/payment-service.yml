server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true    # wraps every KafkaTemplate.send() call in an observation, creating a span AND injecting the current trace context into the outgoing record's HEADERS
    listener:
      observation-enabled: true # on the consuming side, extracts that trace context back OUT of the record's headers and continues the SAME trace, rather than starting a brand new, disconnected one
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      # DISABLED deliberately — explained in full below, this is the
      # single most important config line in this file.
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.learning.*"
        spring.json.use.type.headers: false
        # Since type headers are off, JsonDeserializer needs to be told
        # explicitly what LOCAL class to deserialize order.created
        # messages into — this is Payment Service's OWN copy of the
        # event class (Step 5 below), matching the wire shape Order
        # Service produces, per the Anti-Corruption Layer pattern.
        spring.json.value.default.type: com.learning.payment_service.event.OrderCreatedEvent
