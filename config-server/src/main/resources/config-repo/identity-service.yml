server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/identity_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  jwt:
    # In real production, this comes from a secrets manager (AWS Secrets
    # Manager, Vault, etc.), NEVER committed to a config repo in plaintext.
    # This is a deliberately simplified stand-in for learning purposes —
    # generate your own random 256-bit+ string rather than reusing this one.
    secret: "ZWNvbW1lcmNlLWlkZW50aXR5LXNlcnZpY2Utc3VwZXItc2VjcmV0LWtleS1jaGFuZ2UtbWU="
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 days