server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          # We're using EXPLICIT routes rather than
          # discovery.locator.enabled: true (which would auto-generate a
          # route per registered Eureka service name, e.g. /IDENTITY-SERVICE/**).
          # Explicit routes cost more typing but give precise control over
          # each route's path, and — critically for File 2 next — let us
          # attach specific filters (like JWT validation) only where needed.
          routes:
            - id: identity-service-auth
              uri: lb://IDENTITY-SERVICE
              predicates:
                - Path=/api/v1/auth/**
            - id: catalog-service
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/tags/**
            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/api/v1/cart/**
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/orders/**
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v1/payments/**
            - id: review-service
              uri: lb://REVIEW-SERVICE
              predicates:
                - Path=/api/v1/reviews/**
          discovery:
            locator:
              enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

app:
  jwt:
    secret: "ZWNvbW1lcmNlLWlkZW50aXR5LXNlcnZpY2Utc3VwZXItc2VjcmV0LWtleS1jaGFuZ2UtbWU="
  ratelimit:
      # DELIBERATELY strict — auth endpoints (login/register) are the
      # classic target for credential-stuffing/brute-force attacks. A
      # legitimate user rarely needs more than a couple of login attempts
      # per minute; an attacker trying thousands of password guesses is
      # exactly what this limit exists to slow down.
    public:
      capacity: 5
      refill-tokens: 5
      refill-period-seconds: 60
    # Generous — this is the limit for already-authenticated traffic
    # across every other endpoint in the system.
    authenticated:
      capacity: 60
      refill-tokens: 60
      refill-period-seconds: 60