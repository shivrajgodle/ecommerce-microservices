# Every microservice that pulls from this config server gets these
# values UNLESS it overrides them in its own {service-name}.yml.
# This is where truly universal settings belong — not per-service ones.

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  tracing:
    sampling:
      probability: 1.0   # trace EVERY request — fine for local learning; a real production system would sample a fraction (e.g. 0.1 = 10%) to control storage volume and overhead at real traffic scale
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [${spring.application.name},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"